name: Morning NSE Fetch (9:15 AM IST)

on:
  schedule:
    - cron: '45 3 * * 1-5'   # 3:45 UTC = 9:15 AM IST, Mon-Fri
  workflow_dispatch:          # lets you run it manually from the Actions tab

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - run: pip install -r requirements.txt

      - run: python fetch_nse_all_stocks.py

      - uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: 'Auto: morning NSE fetch (9:15 AM)'
          file_pattern: '*.xlsx'
