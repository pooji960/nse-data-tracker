
name: NSE Data Fetch (9:15 AM & 4:15 PM IST)

on:
  schedule:
    - cron: '45 3 * * 1-5'    # 9:15 AM IST
    - cron: '45 10 * * 1-5'   # 4:15 PM IST
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Check Excel file
        run: |
          echo "Current directory:"
          pwd

          echo "Files in workspace:"
          ls -lah

          echo "Checking Excel:"
          ls -lah Data_Analysis_daily.xlsx || true

          echo "File type:"
          file Data_Analysis_daily.xlsx || true

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install requirements
        run: |
          pip install -r requirements.txt

      - name: Fetch NSE data
        run: |
          python fetch_close_data.py

      - name: Commit updated Excel
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: 'Auto: NSE data fetch'
          file_pattern: '*.xlsx'
```
