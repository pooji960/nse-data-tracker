name: NSE Data Fetch

on:
  schedule:
    - cron: '45 3 * * 1-5'
    - cron: '45 10 * * 1-5'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install requirements
        run: pip install -r requirements.txt

      - name: Fetch NSE data
        run: python fetch_close_data.py

      - name: Save Excel
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: 'Auto: NSE data fetch'
          file_pattern: '*.xlsx'
