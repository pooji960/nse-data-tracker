name: NSE Data Fetch (Morning & Evening)

on:
  schedule:
    # 9:15 AM IST = 3:45 AM UTC (Morning fetch)
    - cron: '45 3 * * 1-5'
    # 4:15 PM IST = 10:45 AM UTC (Evening / close fetch)
    - cron: '45 10 * * 1-5'
  workflow_dispatch:   # allows manual run from Actions tab too

jobs:
  fetch-data:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run morning fetch (9:15 AM IST)
        if: github.event.schedule == '45 3 * * 1-5'
        run: python fetch_nse_data.py

      - name: Run evening fetch (4:15 PM IST)
        if: github.event.schedule == '45 10 * * 1-5'
        run: python fetch_close_data.py

      - name: Run both (manual trigger)
        if: github.event_name == 'workflow_dispatch'
        run: |
          python fetch_nse_data.py
          python fetch_close_data.py

      - name: Commit and push updated data
        run: |
          git config --local user.email "actions@github.com"
          git config --local user.name "GitHub Actions"
          git add -A
          git diff --quiet && git diff --staged --quiet || git commit -m "Auto data update: $(date +'%Y-%m-%d %H:%M IST')"
          git push
